<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تاریخچه پخش</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>تاریخچه پخش</h1>
      <nav>
        <a href="/">ارسال</a>
        <a href="/history" class="active">تاریخچه</a>
      </nav>
    </header>

    <div class="card">
      <table id="tbl">
        <thead>
          <tr>
            <th>#</th>
            <th>زمان</th>
            <th>متن</th>
            <th>تصویر</th>
            <th>جمع</th>
            <th>موفق</th>
            <th>ناموفق</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="7" class="muted">در حال بارگذاری…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="/static/util.js"></script>
  <script>
    const PLATFORM_LABEL = window.PLATFORM_LABEL;
    const el = window.el;
    const cleanError = window.cleanError;

    function fmt(ts) { return new Date(ts.replace(' ', 'T') + 'Z').toLocaleString('fa-IR'); }
    function truncate(s, n) { if (!s) return ''; return s.length > n ? s.slice(0, n) + '…' : s; }

    async function load() {
      const r = await fetch('/api/broadcasts');
      if (r.status === 503) { window.location.href = '/setup'; return; }
      const items = await r.json();
      const tb = document.getElementById('rows');
      tb.replaceChildren();
      if (!items.length) {
        tb.appendChild(el('tr', {}, el('td', { colspan: '7', class: 'muted' }, 'هنوز پخشی ثبت نشده.')));
        return;
      }
      for (const b of items) {
        const tr = el('tr', { style: 'cursor:pointer' },
          el('td', {}, '#' + b.id),
          el('td', {}, fmt(b.created_at)),
          el('td', {}, b.text ? truncate(b.text, 60) : el('span', { class: 'muted' }, '—')),
          el('td', {}, b.image_path ? 'دارد' : el('span', { class: 'muted' }, '—')),
          el('td', {}, String(b.total)),
          el('td', {}, el('span', { class: 'pill ok' }, String(b.sent))),
          el('td', {}, b.failed
            ? el('span', { class: 'pill err' }, String(b.failed))
            : document.createTextNode('0')),
        );
        const detailCell = el('td', { colspan: '7' }, el('div', { class: 'muted' }, '…'));
        const detail = el('tr', { style: 'display:none' }, detailCell);
        let loaded = false;

        tr.addEventListener('click', async () => {
          if (detail.style.display !== 'none') { detail.style.display = 'none'; return; }
          detail.style.display = '';
          if (loaded) return;
          loaded = true;
          const r2 = await fetch('/api/broadcasts/' + b.id);
          if (r2.status === 503) { window.location.href = '/setup'; return; }
          const d = await r2.json();
          const wrap = el('div', { class: 'detail-list' });
          for (const x of d.results || []) {
            const ce = cleanError(x.error);
            const row = el('div', { class: 'detail-row' });
            row.appendChild(el('span', { class: 'pill ' + (x.status === 'ok' ? 'ok' : 'err') }, x.status === 'ok' ? '✓' : '✕'));
            row.appendChild(el('span', { class: 'log-plat plat-' + x.platform }, PLATFORM_LABEL[x.platform] || x.platform));
            row.appendChild(el('span', { class: 'log-id' }, x.chat_id));
            if (ce.short) {
              row.appendChild(el('span', { class: x.status === 'ok' ? 'log-msg warn' : 'log-msg err' }, ce.short));
              const det = el('details', { class: 'log-details' });
              det.appendChild(el('summary', {}, 'جزئیات'));
              det.appendChild(el('pre', {}, ce.raw));
              row.appendChild(det);
            }
            wrap.appendChild(row);
          }
          if (!wrap.children.length) wrap.appendChild(el('span', { class: 'muted' }, 'بدون نتیجه'));
          detailCell.replaceChildren(wrap);
        });

        tb.appendChild(tr);
        tb.appendChild(detail);
      }
    }
    load();
  </script>
</body>
</html>
